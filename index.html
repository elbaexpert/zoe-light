const names={commessa:'Commessa',beauty:'Beauty',reception:'Reception',bar:'Bar / Ristorante',ufficio:'Ufficio',social:'Social',musica:'Musica',tata:'Tata / Assistenza',altro:'Altro'};
let city='serravalle',group='tutti',house='tutti',viewMode='all',onlyFav=false;
const storageKey='zoe-ricerca-2026-10-24-v2';let saved={};try{saved=JSON.parse(localStorage.getItem(storageKey)||'{}')}catch(e){}
const validIds=new Set(jobs.map(x=>x.id));const favResetKey='zoe-light-favorites-correction-20261024';try{if(!localStorage.getItem(favResetKey)){for(const k of Object.keys(saved)){if(saved[k]&&saved[k].fav)delete saved[k].fav}localStorage.setItem(storageKey,JSON.stringify(saved));localStorage.setItem(favResetKey,'1')}}catch(e){}
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function persist(){try{localStorage.setItem(storageKey,JSON.stringify(saved))}catch(e){}}
function count(c,g,h){return jobs.filter(x=>x.city===c&&(g==='tutti'||x.group===g)&&(h==='tutti'||(h==='si'?x.housing==='si':x.housing!=='si'))).length}
function btn(label,n,active,fn,disabled=false){const b=document.createElement('button');b.innerHTML=esc(label)+' <span class="num">'+n+'</span>';b.className=active?'sel':'';b.disabled=disabled;b.onclick=fn;return b}
const iconFor={commessa:'🛍️',beauty:'💄',reception:'🛎️',bar:'☕',ufficio:'💼',social:'📱',musica:'🎵',tata:'🧸',altro:'✨'};
function mini(){const nav=document.getElementById('compactNav');nav.replaceChildren();const top=document.createElement('div');top.className='city-row';for(const [c,label] of [['serravalle','SERRAV.+NOVI'],['milano','MILANO']]){let b=document.createElement('button');b.className='city-mini '+(city===c&&!onlyFav?'sel':'');b.innerHTML=esc(label)+' <span class="mini-count">'+count(c,'tutti','tutti')+'</span>';b.onclick=()=>{city=c;group='tutti';house='tutti';onlyFav=false;render()};top.append(b)}let fb=document.createElement('button');fb.className='fav-filter '+(onlyFav?'sel':'');fb.innerHTML='♥ <span class="mini-count">'+jobs.filter(x=>saved[x.id]?.fav).length+'</span>';fb.setAttribute('aria-label','Preferiti');fb.onclick=()=>{onlyFav=!onlyFav;group='tutti';house='tutti';viewMode='all';render()};top.append(fb);nav.append(top);const cats=document.createElement('div');cats.className='cat-row';for(const [g,label] of Object.entries(names)){let n=count(city,g,'tutti');if(!n)continue;let b=document.createElement('button');b.className='category-'+g+(group===g?' sel':'');b.innerHTML='<span aria-hidden="true">'+iconFor[g]+'</span><span class="cat-label">'+esc(label)+'</span><span class="mini-count">'+n+'</span>';b.title=label+' ('+n+')';b.setAttribute('aria-label',label+' '+n);b.onclick=()=>{group=group===g?'tutti':g;render()};cats.append(b)}nav.append(cats)}

function render(){mini();let cs=document.getElementById('cities');cs.replaceChildren();for(const [id,label] of [['serravalle','SERRAVALLE + NOVI'],['milano','MILANO']])cs.append(btn(label,count(id,'tutti','tutti'),city===id,()=>{city=id;group='tutti';house='tutti';render()}));
let gs=document.getElementById('groups');gs.replaceChildren();gs.append(btn('Tutti',count(city,'tutti',house),group==='tutti',()=>{group='tutti';render()}));for(const [g,label] of Object.entries(names)){let n=count(city,g,house);if(n)gs.append(btn(iconFor[g]+' '+label,n,group===g,()=>{group=g;render()}))}
let hs=document.getElementById('housing');hs.replaceChildren();for(const [h,label] of [['si','Verifica'],['nd','No']]){let n=count(city,group,h);if(n>0)hs.append(btn(label,n,house===h,()=>{house=house===h?'tutti':h;render()}))}
let q=document.getElementById('search').value.toLowerCase().trim();let data=jobs.filter(x=>x.city===city&&(group==='tutti'||x.group===group)&&(house==='tutti'||(house==='si'?x.housing==='si':x.housing!=='si'))&&(!q||[x.title,x.company,x.loc,x.detail].join(' ').toLowerCase().includes(q))&&(viewMode==='all'||(viewMode==='seen'?!!saved[x.id]?.seen:!saved[x.id]?.seen))&&(!onlyFav||!!saved[x.id]?.fav));data.sort((a,b)=>{let score=x=>(x.linkkind==='diretto'?4:0)+(x.housing==='si'&&city==='milano'?5:0)+(saved[x.id]?.seen?-5:0);return score(b)-score(a)});document.getElementById('results').textContent=data.length+' annunci';document.querySelectorAll('.view-modes button').forEach(b=>{b.classList.toggle('sel',b.dataset.view===viewMode);b.setAttribute('aria-pressed',String(b.dataset.view===viewMode))});

let grid=document.getElementById('jobs');grid.replaceChildren();if(!data.length)grid.innerHTML='<div class="empty">Nessun risultato con questi filtri. Prova “Tutti”.</div>';
for(const x of data){const card=document.createElement('article');card.className='job';let st=saved[x.id]||{};if(st.seen)card.classList.add('was-seen');let direct=x.linkkind==='diretto';card.innerHTML='<div><h3><span class="jobicon '+esc(x.group)+'" aria-hidden="true">'+(iconFor[x.group]||'✨')+'</span>'+esc(x.title)+'</h3><div class="company">'+esc(x.company)+' · '+esc(x.loc)+'</div></div><div class="tags"><span class="tag '+esc(x.group)+'">'+esc(names[x.group]||'Altro')+'</span>'+(x.housing==='si'?'<span class="tag house">Alloggio dichiarato</span>':'')+(direct?'<span class="tag source">Offerta specifica</span>':'<span class="tag source">Elenco del portale</span>')+(x.caution?'<span class="tag warn">'+esc(x.caution)+'</span>':'')+'</div><p class="detail">'+esc(x.detail)+'</p><div class="actions"><a class="open" href="'+esc(x.url)+'" target="_blank" rel="noopener noreferrer">'+(direct?'Apri offerta ↗':'Consulta elenco ↗')+'</a><button class="small fav '+(st.fav?'active':'')+'" title="Preferito" aria-label="Preferito">'+(st.fav?'♥':'♡')+'</button><button class="small seenbtn '+(st.seen?'seen':'')+'" title="Già visto" aria-label="Già visto">'+(st.seen?'✓':'○')+'</button></div>';card.querySelector('.fav').onclick=()=>{saved[x.id]={...(saved[x.id]||{}),fav:!saved[x.id]?.fav};persist();render()};card.querySelector('.seenbtn').onclick=()=>{saved[x.id]={...(saved[x.id]||{}),seen:!saved[x.id]?.seen};persist();render()};card.querySelector('.open').addEventListener('click',()=>{saved[x.id]={...(saved[x.id]||{}),seen:true};persist();card.querySelector('.seenbtn').classList.add('seen');card.querySelector('.seenbtn').textContent='✓';card.classList.add('was-seen')});grid.append(card)}
let ag=document.getElementById('agencies');ag.replaceChildren();for(const [n,u,d] of agencies[city].filter((x,i,a)=>a.findIndex(y=>y[1]===x[1])===i)){let e=document.createElement('div');e.className='agency';e.innerHTML='<a target="_blank" rel="noopener noreferrer" href="'+esc(u)+'">'+esc(n)+' ↗</a><small>'+esc(d)+'</small>';ag.append(e)}document.getElementById('modalAgencies').innerHTML=ag.innerHTML;document.getElementById('agencyTitle').textContent='Agenzie · '+(city==='milano'?'Milano':'Serravalle + Novi');}
function openAgencies(){const m=document.getElementById('agencyModal');m.hidden=false;document.body.classList.add('modal-open');document.getElementById('closeAgencies').focus()}function closeAgencies(){document.getElementById('agencyModal').hidden=true;document.body.classList.remove('modal-open')}document.getElementById('closeAgencies').onclick=closeAgencies;document.getElementById('agencyBackdrop').onclick=closeAgencies;document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAgencies()});document.getElementById('agencyRowBtn').onclick=openAgencies;document.querySelectorAll('.view-modes button').forEach(b=>b.onclick=()=>{viewMode=b.dataset.view;render()});document.getElementById('search').addEventListener('input',render);document.getElementById('searchToggle').onclick=()=>{const w=document.getElementById('searchWrap');w.classList.toggle('expanded');if(w.classList.contains('expanded'))document.getElementById('search').focus();else{document.getElementById('search').value='';render()}};render();
